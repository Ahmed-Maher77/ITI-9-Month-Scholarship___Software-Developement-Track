<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>404 | Page Not Found</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Bebas+Neue&display=swap"
            rel="stylesheet"
        />
        <style>
            :root {
                --bg-1: #f5efe4;
                --bg-2: #f8fafc;
                --ink: #11212d;
                --muted: #3b4f5c;
                --accent: #ff6b35;
                --accent-2: #ffd166;
                --surface: rgba(255, 255, 255, 0.7);
                --border: rgba(17, 33, 45, 0.12);
            }

            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            body {
                min-height: 100vh;
                font-family: "Space Grotesk", sans-serif;
                color: var(--ink);
                background:
                    radial-gradient(
                        circle at 15% 20%,
                        #ffd6a5 0%,
                        transparent 30%
                    ),
                    radial-gradient(
                        circle at 85% 15%,
                        #bde0fe 0%,
                        transparent 35%
                    ),
                    linear-gradient(135deg, var(--bg-1), var(--bg-2));
                display: grid;
                place-items: center;
                padding: 2rem;
                overflow: hidden;
            }

            .orb {
                position: fixed;
                border-radius: 50%;
                filter: blur(4px);
                opacity: 0.55;
                pointer-events: none;
                animation: float 8s ease-in-out infinite;
            }

            .orb.one {
                width: 220px;
                height: 220px;
                top: -60px;
                left: -30px;
                background: #ffb4a2;
            }

            .orb.two {
                width: 180px;
                height: 180px;
                right: -40px;
                bottom: -40px;
                background: #90dbf4;
                animation-delay: 1.4s;
            }

            .card {
                width: min(760px, 100%);
                background: var(--surface);
                border: 1px solid var(--border);
                backdrop-filter: blur(10px);
                border-radius: 22px;
                padding: clamp(1.25rem, 3vw, 2.25rem);
                box-shadow: 0 20px 45px rgba(17, 33, 45, 0.15);
                animation: rise 0.7s ease both;
            }

            .status {
                font-family: "Bebas Neue", sans-serif;
                letter-spacing: 0.08em;
                font-size: clamp(4.5rem, 12vw, 7.5rem);
                line-height: 0.9;
                color: var(--ink);
                text-shadow: 2px 2px 0 var(--accent-2);
            }

            h1 {
                margin-top: 0.55rem;
                font-size: clamp(1.5rem, 4vw, 2.1rem);
            }

            p {
                margin-top: 0.9rem;
                color: var(--muted);
                font-size: clamp(1rem, 2.5vw, 1.05rem);
                line-height: 1.6;
                max-width: 56ch;
            }

            .actions {
                margin-top: 1.5rem;
                display: flex;
                gap: 0.8rem;
                flex-wrap: wrap;
            }

            .btn {
                text-decoration: none;
                font-weight: 700;
                border-radius: 12px;
                padding: 0.72rem 1.1rem;
                transition:
                    transform 0.2s ease,
                    box-shadow 0.2s ease,
                    background 0.2s ease;
                border: 1px solid transparent;
            }

            .btn.primary {
                background: var(--ink);
                color: #ffffff;
                box-shadow: 0 10px 20px rgba(17, 33, 45, 0.2);
            }

            .btn.secondary {
                color: var(--ink);
                border-color: var(--border);
                background: #ffffff;
            }

            .btn:hover {
                transform: translateY(-2px);
            }

            .hint {
                margin-top: 1.2rem;
                font-size: 0.92rem;
                color: #4b5f6b;
            }

            code {
                background: rgba(17, 33, 45, 0.08);
                border-radius: 8px;
                padding: 0.15rem 0.4rem;
            }

            @keyframes rise {
                from {
                    opacity: 0;
                    transform: translateY(12px) scale(0.98);
                }
                to {
                    opacity: 1;
                    transform: translateY(0) scale(1);
                }
            }

            @keyframes float {
                0%,
                100% {
                    transform: translateY(0px);
                }
                50% {
                    transform: translateY(-12px);
                }
            }

            @media (max-width: 640px) {
                body {
                    padding: 1rem;
                }

                .card {
                    border-radius: 18px;
                }
            }
        </style>
    </head>
    <body>
        <div class="orb one" aria-hidden="true"></div>
        <div class="orb two" aria-hidden="true"></div>

        <main class="card" role="main">
            <div class="status" aria-label="404">404</div>
            <h1>Wrong Turn. This Page Does Not Exist.</h1>
            <p>
                The address might be mistyped, or the page may have moved to
                another route. Try heading back home or return to the previous
                page.
            </p>

            <div class="actions">
                <a class="btn primary" href="/">Go Home</a>
                <a class="btn secondary" href="javascript:history.back()"
                    >Go Back</a
                >
            </div>

            <p class="hint">
                Tip: Check your API route format like
                <code>/api/categories</code>.
            </p>
        </main>
    </body>
</html>
