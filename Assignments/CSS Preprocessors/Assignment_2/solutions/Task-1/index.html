<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles/css/main.css">
</head>
<body>
    <form action="">
        <fieldset>
            <legend>Personal Information</legend>
            <input type="text" name="first_name" placeholder="Enter your first name..." class="col-12 col-md-6 col-lg-4" />
            <input type="text" name="last_name" placeholder="Enter your last name..." class="col-12 col-md-6 col-lg-4" />
            <input type="email" name="email" placeholder="Enter your email..." class="col-12 col-md-6 col-lg-4" />
        </fieldset>
        <fieldset>
            <legend>Professional Information</legend>
            <input type="text" name="job_title" placeholder="Enter your job title..." class="col-12 col-md-6 col-lg-4" />
            <input type="text" name="company" placeholder="Enter your company name..." class="col-12 col-md-6 col-lg-4" />
            <input type="number" name="experience" placeholder="Enter your experience in years..." class="col-12 col-md-6 col-lg-4" />
        </fieldset>
        <fieldset>
            <legend>Contact Information</legend>
            <input type="tel" name="phone" placeholder="Enter your phone number..." class="col-12 col-md-6 col-lg-4" />
            <input type="text" name="address" id="" placeholder="Enter your address..." class="col-12 col-md-6 col-lg-4" />
            <input type="url" name="website" placeholder="Enter your website URL..." class="col-12 col-md-6 col-lg-4" />
        </fieldset>
        <input id="form-submit" type="submit" value="Submit">
    </form>
</body>
</html>
