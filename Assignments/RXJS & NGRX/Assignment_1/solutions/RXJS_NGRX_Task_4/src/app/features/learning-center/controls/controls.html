<div class="controls-card">
  <h2 class="controls-card__title">Action Controls</h2>
  <div class="controls-card__buttons">
    @if ((isLoggedIn$ | async) === false) {
      <button class="btn btn--primary" (click)="onLogin()">
        <svg class="btn__icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/>
        </svg>
        Login
      </button>
    } @else {
      <button class="btn btn--secondary" (click)="onLogout()">
        <svg class="btn__icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
        Logout
      </button>
    }
    <button class="btn btn--primary" (click)="onEnroll()" [disabled]="(isLoggedIn$ | async) === false">
      <svg class="btn__icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 5v14"/><path d="M5 12h14"/>
      </svg>
      Enroll in Course
    </button>
  </div>
</div>
