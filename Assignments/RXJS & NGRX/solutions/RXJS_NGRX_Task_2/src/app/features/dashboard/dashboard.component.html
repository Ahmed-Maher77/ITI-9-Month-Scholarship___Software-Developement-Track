<div class="dashboard">
  <header class="app-header">
    <div class="header-left">
      <div class="header-brand">
        <svg class="header-logo" width="20" height="20" viewBox="0 0 20 20" fill="none">
          <circle cx="10" cy="10" r="9" stroke="currentColor" stroke-width="1.5"/>
          <circle cx="10" cy="10" r="4" fill="currentColor"/>
        </svg>
        <div>
          <h1 class="header-title">City Operations Center</h1>
          <p class="header-subtitle">Real-Time Monitoring</p>
        </div>
      </div>
    </div>
    <div class="header-right">
      <span class="header-time">{{ currentTime | date:'HH:mm:ss' }}</span>
    </div>
  </header>

  <app-status-banner [active]="(ready$ | async) === true" />

  <main class="dashboard-content">
    @if (loading$ | async) {
      <app-loading-screen />
    } @else if (error$ | async; as error) {
      <app-error-screen
        [errorMessage]="error"
        (retry)="onRetry()"
      />
    } @else if (ready$ | async) {
      <div class="sensors-grid">
        @if (weatherInfo$ | async; as wi) {
          <app-sensor-card
            label="Temperature"
            [value]="wi.temperature + '°C'"
            [meta]="'Updated ' + ((lastUpdated | date:'HH:mm:ss') || '')"
          />
        }
        @if (flightStatus$ | async; as fs) {
          <app-sensor-card
            label="Traffic"
            [value]="fs.totalFlights + ' flights'"
            [meta]="fs.delayedFlights + ' delayed · ' + fs.cancelledFlights + ' cancelled'"
          />
        }
        @if (gateInfo$ | async; as gi) {
          <app-sensor-card
            label="Gates"
            [value]="gi.availableGates + ' available'"
            [meta]="gi.occupiedGates + ' occupied · ' + gi.maintenanceGates + ' maintenance'"
          />
        }
      </div>

      <div class="feed-section">
        <app-activity-feed [entries]="activities" />
      </div>
    }
  </main>
</div>
