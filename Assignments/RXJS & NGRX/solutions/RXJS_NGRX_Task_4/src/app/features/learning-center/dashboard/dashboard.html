<header class="hero">
  <h1 class="hero__title">Learning Activity Center</h1>
  <p class="hero__subtitle">Track onboarding progress and user interactions in real time.</p>
</header>

<main class="main-content">
  <section class="section">
    <app-controls />
  </section>

  <div class="separator" aria-hidden="true">
    <div class="separator__line"></div>
    <div class="separator__dot"></div>
    <div class="separator__line"></div>
  </div>

  @if ((state$ | async); as state) {
    <section class="section">
      <app-onboarding-progress
        [isLoggedIn]="state.isLoggedIn"
        [onboardingInProgress]="state.onboardingInProgress"
        [onboardingCompleted]="state.onboardingCompleted"
      />
    </section>
  }

  <div class="separator" aria-hidden="true">
    <div class="separator__line"></div>
    <div class="separator__dot"></div>
    <div class="separator__line"></div>
  </div>

  <section class="section">
    <app-activity-feed />
  </section>

  <div class="separator" aria-hidden="true">
    <div class="separator__line"></div>
    <div class="separator__dot"></div>
    <div class="separator__line"></div>
  </div>

  <section class="section section--full">
    <app-observable-demo />
  </section>
</main>
